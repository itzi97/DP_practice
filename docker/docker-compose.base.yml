# Original docker-compose from class activities
# Used as the base for docker-compose.yml
# Source: DP_blackboard/Docker/docker-compose.yml

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped


  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    restart: unless-stopped


  hdfs:
    build: ./hdfs
    container_name: hdfs
    hostname: hdfs
    ports:
      - "9870:9870"
      - "9000:9000"
      - "9864:9864"
      - "9868:9868"
    volumes:
      - hdfs_data:/data
      - hdfs_logs:/var/log/hadoop
    restart: unless-stopped


  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped


  postgres:
    image: postgres:9.6
    container_name: postgres
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      POSTGRES_DB: sparkdb
    ports:
      - "5432:5432"
    restart: unless-stopped


  spark:
    image: apache/spark:3.5.8-scala2.12-java11-python3-r-ubuntu
    container_name: spark
    depends_on:
      - hdfs
      - kafka
      - mongodb
      - postgres
    command: bash -lc "sleep infinity"
    ports:
      - "4040:4040"
    volumes:
      - ./data:/data
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    environment:
      - HOME=/root
    restart: unless-stopped


volumes:
  hdfs_data:
  hdfs_logs:
