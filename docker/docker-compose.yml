# Assignment docker-compose
# Based on the class docker-compose (docker-compose.base.yml) with the following changes:
#   - Removed Zookeeper and Kafka (not required for this practice)
#   - Replaced single 'spark' container with Spark Standalone cluster:
#     spark-master (1 core, 512m) + spark-worker-1 + spark-worker-2 (4 cores, 8g each)
# Machine: ThinkPad P1 Gen 7 — Intel Core Ultra 7 165H (16 cores), 32GB RAM

services:

  hdfs:
    build: ./hdfs
    container_name: hdfs
    hostname: hdfs
    ports:
      - "9870:9870"
      - "9000:9000"
      - "9864:9864"
      - "9868:9868"
    volumes:
      - hdfs_data:/data
      - hdfs_logs:/var/log/hadoop
    restart: unless-stopped


  postgres:
    image: postgres:9.6
    container_name: postgres
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      POSTGRES_DB: sparkdb
    ports:
      - "5432:5432"
    restart: unless-stopped


  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped


  spark-master:
    image: apache/spark:3.5.8-scala2.12-java11-python3-r-ubuntu
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MASTER_HOST=spark-master
      - HOME=/root
    ports:
      - "8080:8080"   # Spark Standalone WebUI
      - "7077:7077"   # Master port
    volumes:
      - ./data:/data
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    restart: unless-stopped


  spark-worker-1:
    image: apache/spark:3.5.8-scala2.12-java11-python3-r-ubuntu
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=8g
      - HOME=/root
    depends_on:
      - spark-master
    volumes:
      - ./data:/data
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    restart: unless-stopped


  spark-worker-2:
    image: apache/spark:3.5.8-scala2.12-java11-python3-r-ubuntu
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=8g
      - HOME=/root
    depends_on:
      - spark-master
    volumes:
      - ./data:/data
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    restart: unless-stopped


volumes:
  hdfs_data:
  hdfs_logs:
