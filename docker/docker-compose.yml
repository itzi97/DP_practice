# Assignment docker-compose — built incrementally
# Step 2_5: added Spark Standalone cluster (master + 2 workers)
# Step 2_7: exposed port 4040 for Spark Application WebUI

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped

  hdfs:
    build: ./hdfs
    container_name: hdfs
    hostname: hdfs
    ports:
      - "9870:9870"
      - "9000:9000"
      - "9864:9864"
      - "9868:9868"
    volumes:
      - hdfs_data:/data
      - hdfs_logs:/var/log/hadoop
    restart: unless-stopped

  postgres:
    image: postgres:9.6
    container_name: postgres
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      POSTGRES_DB: sparkdb
    ports:
      - "5432:5432"
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.8-scala2.12-java11-python3-r-ubuntu
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MASTER_HOST=spark-master
      - HOME=/root
    ports:
      - "8080:8080" # Spark Standalone WebUI
      - "7077:7077" # Master port
      - "4040:4040" # Spark Application WebUI
    volumes:
      - ./data:/data
      - ./jars:/opt/spark/jars/extra
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    restart: unless-stopped

  spark-worker-1:
    image: apache/spark:3.5.8-scala2.12-java11-python3-r-ubuntu
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=8g
      - HOME=/root
    depends_on:
      - spark-master
    volumes:
      - ./data:/data
      - ./jars:/opt/spark/jars/extra
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    restart: unless-stopped

  spark-worker-2:
    image: apache/spark:3.5.8-scala2.12-java11-python3-r-ubuntu
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=8g
      - HOME=/root
    depends_on:
      - spark-master
    volumes:
      - ./data:/data
      - ./jars:/opt/spark/jars/extra
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    restart: unless-stopped

volumes:
  hdfs_data:
  hdfs_logs:
